[project]
name = "bisim"
version = "1.1.0"
description = "Behavior-addressed code: address functions and classes by what they do, witnessed by humans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manav Patel" }]
keywords = ["testing", "verification", "code-review", "ai-generated-code", "content-addressing", "behavioral-diff", "intent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://github.com/manav8498/bisim"
Changelog = "https://github.com/manav8498/bisim/blob/main/CHANGELOG.md"
Issues = "https://github.com/manav8498/bisim/issues"

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
bisim = "bisim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bisim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
