[project]
name = "bisim"
version = "0.4.0"
description = "Behavior-addressed code: address functions by what they do, witnessed by humans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
bisim = "bisim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bisim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
