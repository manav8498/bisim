name: release
# Publishes to PyPI with trusted publishing (OIDC). No token is stored anywhere.
# One-time setup on PyPI: Account → Publishing → add pending publisher
#   owner: manav8498  repository: bisim  workflow: release.yml  environment: pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q build && python -m build
      - run: python -m pip install -q dist/*.whl pytest && pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
